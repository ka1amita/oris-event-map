<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ORIS map">
<meta name="theme-color" content="#FFFFFF">
<title>ORIS map</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Lexend:wght@600;700&display=swap">
<style>
:root {
  --ink: #14181F;
  --muted: #4B5560;
  --line: #C5CCCB;
  --orange: #FF7A1A;
  --orange-dark: #D9560A;
  --select: #1F6FEB;
  --sans: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  --disc: Lexend, Figtree, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--sans); color: var(--ink); background: #EAEEE4; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--select); outline-offset: 2px; }
#map { position: fixed; inset: 0; z-index: 0; background: #EAEEE4; }

/* Top bar */
.top { position: fixed; z-index: 1000; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 640px; }
.top > * { pointer-events: auto; }
.head { background: #fff; border-radius: 18px; box-shadow: 0 4px 14px rgba(20,24,31,.16); }
.bar { display: flex; align-items: center; gap: 4px; padding: 6px 4px 6px 6px; }
.range-btn { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 4px 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; }
.range-btn:hover { background: #F1F3F3; }
.range-line { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; line-height: 24px; white-space: nowrap; }
.range-line svg { flex: 0 0 auto; transition: transform .15s ease; }
.range-btn[aria-expanded="true"] .range-line svg { transform: rotate(180deg); }
.count { font-size: 13px; line-height: 18px; color: var(--muted); min-height: 18px; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: #F1F3F3; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { flex: 0 0 auto; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(20,24,31,.14); }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.dates { display: flex; gap: 4px; padding: 0 6px 6px; border-top: 1px solid #E3E6E5; padding-top: 6px; }
.dates[hidden] { display: none; }
/* Week presets as one split pill: "This | Next week". Each half toggles; both on = one solid pill */
.weeks { flex: 0 0 auto; display: inline-flex; height: 44px; border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 2px 8px rgba(20,24,31,.14); overflow: hidden; }
.weeks .fchip { height: 42px; border: 0; border-radius: 0; box-shadow: none; }
.weeks .fchip[data-preset="this"] { padding: 0 12px 0 16px; }
.weeks .fchip[data-preset="next"] { padding: 0 16px 0 12px; border-left: 1px solid var(--line); }
.weeks .fchip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.weeks .fchip[data-preset="this"][aria-pressed="true"] + .fchip[aria-pressed="true"] { border-left-color: rgba(255,255,255,.35); }
.weeks:has(.fchip[aria-pressed="true"]) { border-color: var(--ink); }
.date-field { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border-radius: 12px; }
.date-field:focus-within { background: #F1F3F3; }
.date-field span { flex: 0 0 auto; font-size: 13px; font-weight: 600; color: var(--muted); }
.date-field input { flex: 1 1 auto; width: 100%; min-width: 0; border: 0; padding: 0; background: transparent; font: 700 16px/22px var(--sans); color: var(--ink); }
.date-field input:focus { outline: none; }

/* Status line */
.status { position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); max-width: calc(100% - 24px); padding: 10px 16px; border-radius: 20px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
.status[hidden] { display: none; }
.status button { border: 0; background: #fff; color: var(--ink); border-radius: 14px; height: 28px; padding: 0 12px; font-weight: 700; cursor: pointer; }

/* Markers */
.leaflet-div-icon, .omark { background: transparent; border: 0; }
.stack { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.pin { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; border-radius: 22px; }
.chip { position: relative; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 7px; border-radius: 22px; background: #fff; color: var(--ink); border-style: solid; box-shadow: 0 2px 6px rgba(20,24,31,.22); font-family: var(--sans); }
.chip.closed { background: #F1F3F3; color: #5A636B; }
.chip.entered { background: var(--orange); color: var(--ink); }
.pin.sel .chip { box-shadow: 0 0 0 3px var(--select), 0 8px 18px rgba(20,24,31,.3); }
.tail { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 8px solid #fff; }
.tail.closed { border-top-color: #F1F3F3; }
.tail.entered { border-top-color: var(--orange); }
.disc { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font: 700 12px/1 var(--disc); }
.lines { display: flex; flex-direction: column; gap: 3px; }
.day { font-size: 15px; font-weight: 600; line-height: 18px; white-space: nowrap; }
.state { display: flex; align-items: center; gap: 4px; height: 8px; }
.pips { display: flex; gap: 3px; }
.pip { width: 7px; height: 7px; border-radius: 4px; border: 1px solid currentColor; }
.pip.on { background: currentColor; }
.badge { position: absolute; width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
.b-sport { top: -9px; left: -7px; border: 2px solid var(--orange-dark); background: #fff; color: var(--orange-dark); }
.b-night { top: -9px; right: -7px; border: 2px solid #fff; background: #24307A; color: #fff; }
.b-relay { bottom: -9px; left: -7px; border: 2px solid #fff; background: #5A636B; color: #fff; }
.b-group { bottom: -9px; right: -9px; width: auto; padding: 0 6px 0 5px; gap: 3px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); font: 700 11px/1 var(--sans); }
.svcs { position: absolute; top: -8px; left: 19px; display: flex; gap: 2px; }
.b-svc { width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; }
.b-svc.ordered { background: var(--orange); }
/* Compact marker for zoomed-out views */
.dot { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font: 700 11px/1 var(--disc); cursor: pointer; box-shadow: 0 1px 4px rgba(20,24,31,.35); }
.dot.entered::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--orange); }
.dot.sel { outline: 3px solid var(--select); outline-offset: 4px; }
/* Several events at (nearly) the same spot when zoomed out: one dot with a count, fans out on hover or tap */
.dotgroup { position: absolute; left: 0; top: 0; width: 30px; height: 30px; transform: translate(-50%, -50%); border-radius: 50%; }
.dotgroup .dot { left: 50%; top: 50%; transition: transform .15s ease; }
.dotgroup.open { width: var(--size); height: var(--size); background: rgba(255,255,255,.6); box-shadow: 0 2px 10px rgba(20,24,31,.2); }
.dotgroup.open .dot { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))); }
.dg-count { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--ink); color: #fff; font: 700 11px/18px var(--sans); text-align: center; pointer-events: none; }
.dotgroup.open .dg-count { display: none; }
@media (prefers-reduced-motion: reduce) { .dotgroup .dot { transition: none; } }

/* Detail card */
.card { position: fixed; z-index: 1000; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 520px; max-height: calc(100vh - 320px); max-height: calc(100dvh - 320px); overflow-y: auto; padding: 16px; background: #fff; border-radius: 22px; box-shadow: 0 10px 30px rgba(20,24,31,.24); display: flex; flex-direction: column; gap: 12px; }
.card[hidden] { display: none; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card h2 { margin: 0; font-size: 20px; line-height: 26px; }
.card .meta { font-size: 14px; line-height: 20px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: #F1F3F3; font-size: 13px; font-weight: 600; white-space: nowrap; }
.sw { width: 12px; height: 12px; border-radius: 6px; }
.sw.ring { background: #fff; border-style: solid; box-shadow: 0 0 0 1px var(--line); }
.tag.ordered { background: var(--orange); }
.svc-names { font-size: 13px; line-height: 18px; color: var(--muted); }
.steps { position: relative; display: grid; gap: 8px; }
.steps::before { content: ""; position: absolute; left: calc(50% / var(--n)); right: calc(50% / var(--n)); top: 15px; height: 2px; background: #DDE1E4; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.step .num { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font: 700 15px/1 var(--disc); }
.step.now .num { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
.step .date { font-size: 13px; line-height: 18px; }
.step.past .date { color: #5A636B; text-decoration: line-through; }
.step.now .date { font-weight: 700; }
.step .now-label { font-size: 12px; line-height: 14px; min-height: 14px; font-weight: 700; }
.closes { font-size: 14px; font-weight: 600; line-height: 20px; }
.closes.muted { color: #5A636B; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; font-size: 14px; font-weight: 600; border: 1px solid #B9C0C4; }
.pill.entered { background: var(--orange); border-color: var(--orange); }
.pill.group { border: 1.5px solid var(--ink); }
.pill .letter { width: 22px; height: 22px; border-radius: 11px; color: #fff; display: inline-flex; align-items: center; justify-content: center; font: 700 11px/1 var(--disc); margin-left: -6px; }
.open-btn { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 24px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; }

/* Settings */
dialog { border: 0; border-radius: 22px; padding: 20px; width: min(440px, calc(100% - 24px)); box-shadow: 0 10px 40px rgba(20,24,31,.3); }
dialog::backdrop { background: rgba(20,24,31,.35); }
dialog h2 { margin: 0 0 4px; font-size: 20px; }
dialog p { margin: 0 0 16px; font-size: 14px; line-height: 20px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 14px; font-weight: 600; }
.field input { height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #B9C0C4; font: inherit; }
.field small { font-size: 12px; line-height: 16px; color: var(--muted); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.btn { height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #B9C0C4; background: #fff; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }

.leaflet-control-attribution { font-size: 10px; }
@media (min-width: 700px) {
  .top { left: auto; right: 16px; top: 16px; width: 460px; max-width: none; }
  .card { left: auto; right: 16px; bottom: 16px; width: 460px; max-width: none; max-height: calc(100vh - 260px); max-height: calc(100dvh - 260px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } .range-line svg { transition: none; } }
</style>
</head>
<body>
<div id="map" aria-label="Map of orienteering events"></div>

<header class="top">
  <div class="head">
    <div class="bar">
      <button class="range-btn" id="rangeBtn" type="button" aria-expanded="false" aria-controls="dates">
        <span class="range-line"><span id="rangeLabel"></span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="count" id="count" aria-live="polite"></span>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"></circle><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" stroke="currentColor" stroke-width="1.6"></path></svg>
      </button>
    </div>
    <div class="dates" id="dates" hidden>
      <label class="date-field"><span>From</span><input type="date" id="dFrom"></label>
      <label class="date-field"><span>To</span><input type="date" id="dTo"></label>
    </div>
  </div>
  <div class="filters" role="toolbar" aria-label="Filters">
    <span class="weeks">
      <button class="fchip" type="button" data-preset="this" aria-pressed="true" aria-label="This week">This</button>
      <button class="fchip" type="button" data-preset="next" aria-pressed="false">Next week</button>
    </span>
    <button class="fchip" type="button" id="fOpen" aria-pressed="false">Open</button>
    <button class="fchip" type="button" id="fMine" aria-pressed="false">Entered</button>
  </div>
</header>

<section class="card" id="card" hidden aria-live="polite"></section>
<div class="status" id="status" hidden role="status"></div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Your club and group</h2>
    <p>Used to mark races you and your group are entered in. Saved only in this browser.</p>
    <div class="field">
      <label for="sClub">Club</label>
      <input id="sClub" name="club" autocomplete="off" placeholder="Abbreviation or ORIS ID">
      <small>Without a club, entries are not shown.</small>
    </div>
    <div class="field">
      <label for="sMe">Your registration numbers</label>
      <input id="sMe" name="me" autocomplete="off" placeholder="ABC1234">
      <small>Separate several with commas, for example if you enter for family too.</small>
    </div>
    <div class="field">
      <label for="sGroup">Group registration numbers</label>
      <input id="sGroup" name="group" autocomplete="off" placeholder="Leave empty to count the whole club">
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" type="submit">Cancel</button>
      <button class="btn primary" value="save" type="submit">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------
   Configuration. The patterns below map ORIS names (Czech and English)
   to the marker encoding. Open the page with ?debug=1 to log the
   discipline, level and service names ORIS returns, then adjust here.
------------------------------------------------------------------ */
const CONFIG = {
  api: "https://oris.ceskyorientak.cz/API/",
  eventUrl: (id) => "https://oris.ceskyorientak.cz/Zavod?id=" + id,
  listParams: { all: 1 },            // include events outside the official calendar
  // OpenStreetMap's tile servers refuse requests without a Referer, which is what
  // a page opened straight from disk (file://) sends. There, fall back to CARTO.
  tiles: location.protocol === "file:" ? {
    url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    subdomains: "abcd",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  } : {
    url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    subdomains: "abc",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  },
  compactBelowZoom: 9,               // below this zoom, markers shrink to dots
  concurrency: 4,                    // parallel ORIS requests
  cacheMinutes: 30,
  sport: { 1: "foot", 2: "ski", 3: "mtb", 4: "trail" },
  format: [
    ["sprint", /sprint|^SP\b|^KO\b/i],
    ["middle", /middle|krátk|kratk|střed|stred|^MD\b/i],
    ["long", /long|klasick|dlouh|^LD\b/i]
  ],
  night: /night|noční|nocni/i,
  relay: /relay|štafet|stafet/i,
  team: /team|družst|druzst/i,
  knockout: /knock|vyřazov|vyrazov/i,
  freeOrder: /score|volné pořadí|volne poradi|rogain|free order/i,
  level: [
    ["unofficial", /ostatní|ostatni|neofic|unofficial|trénink|trenink|training|školení|skoleni|soustřed|soustred/i],
    ["regional", /oblast|krajsk|region/i],
    ["champ", /mistrovstv|championship|MČR|\bMCR\b/i],
    ["ranking", /žebříček|zebricek|ranking|pohár|pohar|cup/i]
  ],
  levelFallback: "regional",
  services: {
    bed: /ubytov|nocleh|spaní|spani|tělocvič|telocvic|kemp|camp|accommod|hostel|hotel/i,
    meals: /strav|večeř|vecer|oběd|obed|snídan|snidan|jídl|jidl|meal|dinner|lunch|breakfast|penz|pension/i
  }
};

const FORMAT = {
  sprint: { bg: "#F2B705", fg: "#2A2000", text: "S", name: "Sprint" },
  middle: { bg: "#2A6FD1", fg: "#FFFFFF", text: "M", name: "Middle" },
  long:   { bg: "#1B7F43", fg: "#FFFFFF", text: "L", name: "Long" },
  other:  { bg: "#C9CED2", fg: "#2B323A", text: "+", name: "Other" }
};
const LEVEL = {
  unofficial: { bc: "#FFFFFF", bw: 1.5, name: "Unofficial" },
  regional:   { bc: "#8A949B", bw: 1.5, name: "Regional" },
  ranking:    { bc: "#A8672D", bw: 2.5, name: "National ranking" },
  champ:      { bc: "#B8860B", bw: 3.5, name: "Championship" }
};
const SPORT_NAME = { foot: "Foot-O", ski: "Ski-O", mtb: "MTBO", trail: "Trail-O" };
const TIER = {
  1: { bg: "#5BC44A", fg: "#0C2A08" },
  2: { bg: "#F5A524", fg: "#3A2000" },
  3: { bg: "#D7324A", fg: "#FFFFFF" }
};

const ICON = {
  foot: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16"><path d="M2 12.5V8.5l3-1.2 1.2-3.3 1.8 1c.8.5 1.7.8 2.6 1l1.5.3c1 .2 1.7 1 1.9 2l.2 2.2z" fill="currentColor"/></svg>',
  mtb: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="11" r="2.6"/><circle cx="12" cy="11" r="2.6"/><path d="M4 11l3-5.5h4M7 5.5l2 5.5h3M10.5 4h2"/></svg>',
  ski: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 11.5L13.5 8M3 14.2l11.5-3.5M10.5 2.5l-2 8"/></svg>',
  trail: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg>',
  night: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16"><path d="M12.8 9.6A5.6 5.6 0 016.4 3.2a5.6 5.6 0 106.4 6.4z" fill="currentColor"/></svg>',
  relay: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4l4 4-4 4M9 4l4 4-4 4"/></svg>',

/* ---------------- helpers ---------------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const values = (o) => Array.isArray(o) ? o : (o && typeof o === "object" ? Object.values(o) : []);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const text = (...parts) => parts.filter(Boolean).join(" ");
const regList = (s) => String(s || "").split(/[\s,;]+/).map((x) => x.trim().toUpperCase()).filter(Boolean);

function parseDT(s, endOfDay) {
  if (!s) return null;
  const m = /^(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d):(\d\d)(?::(\d\d))?)?/.exec(String(s));
  if (!m || m[1] === "0000") return null;
  if (m[4] === undefined) return new Date(+m[1], +m[2] - 1, +m[3], endOfDay ? 23 : 0, endOfDay ? 59 : 0, endOfDay ? 59 : 0);
  return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
}
const fmt = {
  short: (d) => d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric" }),
  full: (d) => d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" }),
  mid: (d) => d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }),
  range: (a, b) => a.toLocaleDateString("en-GB", { weekday: "short", day: "numeric" }) + " – " + b.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
};
function daysUntil(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(d); b.setHours(0, 0, 0, 0);
  const n = Math.round((b - a) / 86400000);
  return n <= 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days";
}
function rangeFor(kind) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const toSunday = (7 - t.getDay()) % 7;
  if (kind === "next") {
    const from = new Date(t); from.setDate(t.getDate() + toSunday + 1);
    const to = new Date(from); to.setDate(from.getDate() + 6);
    return { from, to };
  }
  const to = new Date(t); to.setDate(t.getDate() + toSunday);
  return { from: t, to };
}

const sameDay = (a, b) => ymd(a) === ymd(b);
const dayDiff = (a, b) => Math.round((new Date(b).setHours(0, 0, 0, 0) - new Date(a).setHours(0, 0, 0, 0)) / 86400000);
// Which presets the current range matches: "this", "next", or both (this week through next Sunday)
function pressedPresets() {
  const t = rangeFor("this"), n = rangeFor("next");
  if (sameDay(rangeFrom, t.from) && sameDay(rangeTo, n.to)) return new Set(["this", "next"]);
  if (sameDay(rangeFrom, t.from) && sameDay(rangeTo, t.to)) return new Set(["this"]);
  if (sameDay(rangeFrom, n.from) && sameDay(rangeTo, n.to)) return new Set(["next"]);
  return new Set();
}
function presetRange(set) {
  const t = rangeFor("this"), n = rangeFor("next");
  return { from: set.has("this") ? t.from : n.from, to: set.has("next") ? n.to : t.to };
}

/* ---------------- ORIS access (JSONP, as the ORIS API documents for cross-domain use) ---------------- */
let seq = 0;
function orisRaw(method, params) {
  return new Promise((resolve, reject) => {
    const cb = "__oris_" + Date.now().toString(36) + "_" + (seq++);
    const q = new URLSearchParams(Object.assign({ format: "json", method }, params, { callback: cb }));
    const s = document.createElement("script");
    const timer = setTimeout(() => { done(); reject(new Error("ORIS did not answer (" + method + ")")); }, 20000);
    function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = (res) => {
      done();
      if (res && res.Status && res.Status !== "OK") reject(new Error("ORIS: " + res.Status));
      else resolve(res ? res.Data : null);
    };
    s.onerror = () => { done(); reject(new Error("Could not reach ORIS (" + method + ")")); };
    s.src = CONFIG.api + "?" + q.toString();
    document.head.appendChild(s);
  });
}
async function oris(method, params) {
  const key = "omap:" + method + ":" + JSON.stringify(params);
  try {
    const hit = JSON.parse(localStorage.getItem(key) || "null");
    if (hit && Date.now() - hit.t < CONFIG.cacheMinutes * 60000) return hit.d;
  } catch (e) { /* ignore broken cache */ }
  const data = await orisRaw(method, params);
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: data })); }
  catch (e) { pruneCache(); }
  return data;
}
function pruneCache() {
  try { Object.keys(localStorage).filter((k) => k.startsWith("omap:")).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
}
async function pool(items, n, fn) {
  let i = 0;
  const workers = Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const item = items[i++]; try { await fn(item); } catch (e) { if (DEBUG) console.warn(e); } }
  });
  await Promise.all(workers);
}

/* ---------------- domain mapping ---------------- */
function classify(raw) {
  const disc = raw.Discipline || {};
  const lvl = raw.Level || {};
  const discText = text(disc.ShortName, disc.NameCZ, disc.NameEN);
  const nameAndDisc = text(discText, raw.Name);
  const lvlText = text(lvl.ShortName, lvl.NameCZ, lvl.NameEN);

  let format = "other";
  for (const [key, re] of CONFIG.format) if (re.test(discText)) { format = key; break; }
  let level = CONFIG.levelFallback;
  for (const [key, re] of CONFIG.level) if (re.test(lvlText)) { level = key; break; }

  const services = values(raw.Services).map((s) => {
    const name = s.NameCZ || s.NameEN || "";
    return { id: String(s.ID), name, kind: serviceKind(name) };
  }).filter((x) => x.name);
  const svcText = services.map((x) => x.name).join(" | ");
  const sportId = raw.Sport && raw.Sport.ID;

  if (DEBUG) console.log(raw.ID, raw.Name, "| discipline:", discText, "| level:", lvlText, "| services:", svcText);

  return {
    format,
    level,
    sport: CONFIG.sport[sportId] || "foot",
    night: CONFIG.night.test(nameAndDisc),
    relay: CONFIG.relay.test(nameAndDisc),
    team: CONFIG.team.test(nameAndDisc),
    knockout: CONFIG.knockout.test(nameAndDisc),
    freeOrder: CONFIG.freeOrder.test(nameAndDisc),
    bed: services.some((x) => x.kind === "bed"),
    meals: services.some((x) => x.kind === "meals"),
    services
  };
}

function serviceKind(name) {
  if (CONFIG.services.bed.test(name)) return "bed";
  if (CONFIG.services.meals.test(name)) return "meals";
  return null;
}

function entryState(raw, now) {
  const deadlines = [1, 2, 3]
    .map((n) => ({ n, date: parseDT(raw["EntryDate" + n], true) }))
    .filter((d) => d.date);
  const opens = parseDT(raw.EntryStart, false);
  if (opens && now < opens) return { phase: "notopen", opens, deadlines, tier: 0 };
  const cur = deadlines.find((d) => d.date >= now);
  if (cur) return { phase: "tier", tier: deadlines.indexOf(cur) + 1, deadlines, opens };
  if (deadlines.length) return { phase: "closed", tier: 0, deadlines, opens };
  return { phase: "unknown", tier: 0, deadlines, opens };
}

function normalize(raw, prev) {
  const date = parseDT(raw.Date, false);
  const lat = parseFloat(raw.GPSLat), lon = parseFloat(raw.GPSLon);
  const ev = Object.assign({}, prev || {}, classify(raw), entryState(raw, new Date()));
  ev.id = String(raw.ID);
  ev.raw = raw;
  ev.name = raw.Name || "Event " + raw.ID;
  ev.place = raw.Place || "";
  ev.org = raw.Org1 && raw.Org1.Abbr ? raw.Org1.Abbr : "";
  ev.date = date;
  ev.lat = isFinite(lat) && lat !== 0 ? lat : null;
  ev.lon = isFinite(lon) && lon !== 0 ? lon : null;
  ev.stages = parseInt(raw.Stages, 10) || 0;
  ev.cancelled = String(raw.Cancelled) === "1";
  ev.outsideOris = String(raw.UseORISForEntries) === "0";
  ev.startList = (parseInt(raw.CurrentStartsCount, 10) || 0) > 0;
  ev.results = (parseInt(raw.CurrentResultsCount, 10) || 0) > 0;
  if (ev.entered === undefined) ev.entered = false;
  if (ev.group === undefined) ev.group = 0;
  if (!ev.ordered) ev.ordered = { bed: false, meals: false, ids: [] };
  return ev;
}

/* ---------------- rendering ---------------- */
function pinHtml(ev, selected, showTail) {
  const F = FORMAT[ev.format], L = LEVEL[ev.level];

  let state = "";
  if (ev.phase === "closed") state += ICON.lock;
  if (ev.phase === "notopen") state += ICON.clock;
  if (ev.phase !== "closed" && ev.deadlines.length) {
    state += '<span class="pips">' + ev.deadlines.map((d, i) => '<span class="pip' + (ev.phase === "tier" && i < ev.tier ? " on" : "") + '"></span>').join("") + "</span>";
  }
  if (ev.entered) state += ICON.check;
  const svcs = (ev.bed ? '<span class="b-svc' + (ev.ordered.bed ? " ordered" : "") + '">' + ICON.bed + "</span>" : "") +
    (ev.meals ? '<span class="b-svc' + (ev.ordered.meals ? " ordered" : "") + '">' + ICON.meals + "</span>" : "");
  return '<div class="pin' + (selected ? " sel" : "") + '" data-id="' + esc(ev.id) + '" tabindex="0" role="button" aria-label="' + esc(ariaLabel(ev)) + '">' +

  "</div>";
}
function dotHtml(ev, selected, dx, dy) {
  const F = FORMAT[ev.format], L = LEVEL[ev.level];
  return '<div class="dot' + (ev.entered ? " entered" : "") + (selected ? " sel" : "") + '" data-id="' + esc(ev.id) + '" tabindex="0" role="button" aria-label="' + esc(ariaLabel(ev)) + '" style="--dx:' + (dx || 0) + "px;--dy:" + (dy || 0) + "px;background:" + F.bg + ";color:" + F.fg + ";box-shadow:0 0 0 " + L.bw + "px " + L.bc + ', 0 1px 4px rgba(20,24,31,.35)">' + F.text + "</div>";
}
function ariaLabel(ev) {
  const parts = [ev.name, ev.date ? fmt.full(ev.date) : "", FORMAT[ev.format].name, LEVEL[ev.level].name, SPORT_NAME[ev.sport]];
  if (ev.night) parts.push("night");
  if (ev.relay) parts.push("relay");
  if (ev.phase === "tier") parts.push("entry deadline " + ev.tier + " of " + ev.deadlines.length + " is current");
  if (ev.phase === "closed") parts.push("entries closed");
  if (ev.phase === "notopen") parts.push("entries open " + fmt.mid(ev.opens));
  if (ev.entered) parts.push("you are entered");
  if (ev.ordered.bed) parts.push("accommodation ordered");
  if (ev.ordered.meals) parts.push("meals ordered");
  if (ev.group > 0) parts.push(ev.group + " from your group");

function cardHtml(ev) {

      ev.deadlines.map((d, i) => {

        const c = st === "past" ? { bg: "#DDE1E4", fg: "#5A636B" } : TIER[n];
        return '<div class="step ' + st + '"><span class="num" style="background:' + c.bg + ";color:" + c.fg + '">' + n + '</span><span class="date">' + fmt.mid(d.date) + '</span><span class="now-label">' + (st === "now" ? "Now" : "") + "</span></div>";
      }).join("") + "</div>";
  }

  let closes = "";
  if (ev.phase === "tier") {
    const d = ev.deadlines[ev.tier - 1].date;
    closes = '<div class="closes">Deadline ' + ev.tier + " closes " + fmt.mid(d) + ", " + daysUntil(d) + "</div>";
  } else if (ev.phase === "notopen") {
    closes = '<div class="closes">Entries open ' + fmt.mid(ev.opens) + ", " + daysUntil(ev.opens) + "</div>";
  } else if (ev.phase === "closed") {
    closes = '<div class="closes muted">Entries closed</div>';
  } else {
    closes = '<div class="closes muted">No entry deadlines in ORIS</div>';
  }

  const pills = [];
  if (settings.club) pills.push(ev.entered ? '<span class="pill entered">' + ICON.check.replace('width="9" height="9"', 'width="14" height="14"') + "You are entered</span>" : '<span class="pill">Not entered</span>');
  if (ev.group > 0) pills.push('<span class="pill group">' + ICON.person + ev.group + " from your group</span>");
  if (ev.startList) pills.push('<span class="pill"><span class="letter" style="background:#D42A7C">S</span>Start list</span>');
  if (ev.results) pills.push('<span class="pill"><span class="letter" style="background:#7B2CBF">V</span>Results</span>');
  if (ev.outsideOris) pills.push('<span class="pill">Entries outside ORIS</span>');

  const meta = [ev.date ? fmt.full(ev.date) : "", ev.place, ev.org].filter(Boolean).map(esc).join(", ");
  return '<div class="card-head"><div><h2>' + esc(ev.name) + '</h2><div class="meta">' + meta + "</div></div>" +
    '<button class="icon-btn" type="button" id="cardClose" aria-label="Close details">' + ICON.close + "</button></div>" +
    '<div class="tags">' + tags.join("") + "</div>" +
    (ev.services.length ? '<div class="svc-names">' + ev.services.map((x) => esc(x.name) + (ev.ordered.ids.indexOf(x.id) >= 0 ? " (ordered)" : "")).join(", ") + "</div>" : "") +
    steps + closes +
    (pills.length ? '<div class="pills">' + pills.join("") + "</div>" : "") +
    '<a class="open-btn" href="' + CONFIG.eventUrl(ev.id) + '" target="_blank" rel="noopener">Open in ORIS</a>';
}

/* ---------------- app state ---------------- */
const params = new URLSearchParams(location.search);
const MAX_DAYS = 62;   // keeps the number of ORIS requests reasonable
let rangeFrom, rangeTo;
let settings = loadSettings();
let events = new Map();     // id -> event
let selectedId = null;
let filters = { open: false, mine: false };
let loadToken = 0;

const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([49.8, 15.5], 7);
L.tileLayer(CONFIG.tiles.url, { maxZoom: 18, subdomains: CONFIG.tiles.subdomains, attribution: CONFIG.tiles.attribution, referrerPolicy: "strict-origin-when-cross-origin" }).addTo(map);
const layer = L.layerGroup().addTo(map);

function compact() { return map.getZoom() < CONFIG.compactBelowZoom; }
function passesFilters(ev) {
  if (ev.cancelled) return false;
  if (filters.open && ev.phase !== "tier") return false;
  if (filters.mine && !ev.entered) return false;
  return true;
}
function visible(ev) { return passesFilters(ev) && ev.lat !== null; }
let drawQueued = false;
function scheduleDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; drawAll(); });
}
// Group events whose markers would overlap at the current zoom
function groupsFor(list, isCompact) {
  const dx = isCompact ? 16 : 90, dy = isCompact ? 16 : 40;
  const groups = [];
  for (const ev of list) {
    const p = map.latLngToLayerPoint([ev.lat, ev.lon]);
    const g = groups.find((g) => Math.abs(g.p.x - p.x) < dx && Math.abs(g.p.y - p.y) < dy);
    if (g) g.items.push(ev); else groups.push({ p, latlng: [ev.lat, ev.lon], items: [ev] });
  }
  return groups;
}
function addGroup(g, isCompact) {
  const n = g.items.length;
  const hasSel = g.items.some((e) => e.id === selectedId);
  let html;
  if (!isCompact) {
    // Zoomed in: stack the chips above the spot, earliest on top; only the bottom one points at the map
    html = '<div class="stack">' + g.items.map((ev, i) => pinHtml(ev, ev.id === selectedId, i === n - 1)).join("") + "</div>";
  } else if (n === 1) {
    html = dotHtml(g.items[0], hasSel, 0, 0);
  } else {
    const r = Math.max(24, n * 6), size = 2 * r + 36;
    html = '<div class="dotgroup' + (hasSel ? " open" : "") + '" style="--size:' + size + 'px">' +
      g.items.map((ev, i) => {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
        return dotHtml(ev, ev.id === selectedId, Math.round(r * Math.cos(a)), Math.round(r * Math.sin(a)));
      }).join("") +
      '<span class="dg-count">' + n + "</span></div>";
  }
  const m = L.marker(g.latlng, {
    icon: L.divIcon({ className: "omark", html, iconSize: [0, 0], iconAnchor: [0, 0] }),
    keyboard: false,
    zIndexOffset: hasSel ? 1000 : (g.items.some((e) => e.entered) ? 500 : 0)
  });
  m.on("click", (e) => {
    const t = e.originalEvent && e.originalEvent.target;
    const el = t && t.closest ? t.closest("[data-id]") : null;
    const ring = m.getElement() && m.getElement().querySelector(".dotgroup");
    // A ring that was folded when the tap started only fans out; nothing gets selected yet
    if (ring && ring.dataset.wasOpen !== "1") { ring.classList.add("open"); return; }
    if (el) select(el.dataset.id);
    else if (n === 1) select(g.items[0].id);
  });
  m.on("add", () => {
    const ring = m.getElement() && m.getElement().querySelector(".dotgroup");
    if (!ring) return;
    // Remember whether the ring was already open when the press began (before any hover or focus opens it)
    ring.addEventListener("pointerdown", () => { ring.dataset.wasOpen = ring.classList.contains("open") ? "1" : "0"; });
    // Hover fans out only with a real mouse; on touch screens the first tap does it
    ring.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") ring.classList.add("open"); });
    ring.addEventListener("pointerleave", (e) => {
      if (e.pointerType === "mouse" && !g.items.some((x) => x.id === selectedId)) ring.classList.remove("open");
    });
    ring.addEventListener("keyup", (e) => { if (e.key === "Tab") { ring.classList.add("open"); ring.dataset.wasOpen = "1"; } });
  });
  layer.addLayer(m);
}
function drawAll() {
  layer.clearLayers();
  const list = [...events.values()].filter(visible).sort((a, b) => (a.date || 0) - (b.date || 0));
  const isCompact = compact();
  groupsFor(list, isCompact).forEach((g) => addGroup(g, isCompact));
  // Both numbers follow the active filters, so they always add up to what matches
  const matching = [...events.values()].filter(passesFilters);
  const noLoc = matching.length - list.length;
  $("#count").textContent = !matching.length
    ? (events.size ? "No events match the filters" : "")
    : list.length + " on map" + (noLoc ? ", " + noLoc + " without location" : "");
  if (selectedId) {
    const ev = events.get(selectedId);
    if (ev && visible(ev)) renderCard(ev); else closeCard();
  }
}
function select(id) {
  if (!events.get(id)) return;
  selectedId = id;
  renderCard(events.get(id));
  scheduleDraw();
}
function renderCard(ev) {
  const card = $("#card");
  card.innerHTML = cardHtml(ev);
  card.hidden = false;
  $("#cardClose").addEventListener("click", closeCard);
}
function closeCard() {
  const had = selectedId !== null;
  selectedId = null;
  $("#card").hidden = true;
  if (had) scheduleDraw();
}
function setStatus(msg, retry) {
  const el = $("#status");
  if (!msg) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = "<span>" + esc(msg) + "</span>" + (retry ? '<button type="button" id="retryBtn">Try again</button>' : "");
  if (retry) $("#retryBtn").addEventListener("click", load);
}

/* ---------------- loading ---------------- */
async function load() {
  const token = ++loadToken;
  const from = rangeFrom, to = rangeTo;
  layer.clearLayers(); events.clear(); closeCard();
  setStatus("Loading events from ORIS");

  let list;
  try {
    list = await oris("getEventList", Object.assign({ datefrom: ymd(from), dateto: ymd(to) }, CONFIG.listParams));
  } catch (e) {
    if (token === loadToken) setStatus(e.message, true);
    return;
  }
  if (token !== loadToken) return;
  values(list).forEach((raw) => { const ev = normalize(raw); events.set(ev.id, ev); });
  drawAll();
  fitToEvents();

  const ids = [...events.keys()].filter((id) => !events.get(id).cancelled);
  if (!ids.length) { setStatus("No events in ORIS for these dates"); return; }

  let done = 0;
  setStatus("Loading details 0 of " + ids.length);
  await pool(ids, CONFIG.concurrency, async (id) => {
    const raw = await oris("getEvent", { id });
    if (token !== loadToken || !raw) return;
    const ev = normalize(Object.assign({}, events.get(id).raw, raw), events.get(id));
    events.set(id, ev);
    scheduleDraw();
    if (selectedId === id) renderCard(ev);
    done++;
    setStatus("Loading details " + done + " of " + ids.length);
  });
  if (token !== loadToken) return;
  drawAll();

  if (settings.club) {
    const me = new Set(regList(settings.me));
    const group = new Set(regList(settings.group));
    done = 0;
    setStatus("Checking your entries");
    await pool(ids, CONFIG.concurrency, async (id) => {
      const data = await oris("getEventEntries", { eventid: id, clubid: settings.club });
      if (token !== loadToken) return;
      const entries = values(data).map((e) => String(e.RegNo || e.RegNum || "").toUpperCase());
      const ev = events.get(id);
      ev.entered = entries.some((r) => me.has(r));
      ev.group = group.size ? entries.filter((r) => group.has(r)).length : entries.length;
      scheduleDraw();
      if (selectedId === id) renderCard(ev);
    });
    if (token !== loadToken) return;
    drawAll();

    // Additional services you ordered (accommodation, meals): only events that offer any
    const withServices = ids.filter((id) => events.get(id).services.length);
    if (me.size && withServices.length) {
      setStatus("Checking your service orders");
      let logged = false;
      await pool(withServices, CONFIG.concurrency, async (id) => {
        const data = await oris("getEventServiceEntries", { eventid: id, clubid: settings.club });
        if (token !== loadToken) return;
        const ev = events.get(id);
        const ordered = { bed: false, meals: false, ids: [] };
        values(data).forEach((o) => {
          if (DEBUG && !logged) { console.log("service order sample", o); logged = true; }
          const reg = String(o.RegNo || o.RegNum || (o.ClubUser && o.ClubUser.RegNo) || "").toUpperCase();
          if (!me.has(reg)) return;
          const sid = String(o.ServiceID || (o.Service && o.Service.ID) || "");
          const svc = ev.services.find((x) => x.id === sid);
          const kind = svc ? svc.kind : serviceKind(o.ServiceNameCZ || (o.Service && (o.Service.NameCZ || o.Service.NameEN)) || "");
          if (sid) ordered.ids.push(sid);
          if (kind) ordered[kind] = true;
        });
        ev.ordered = ordered;
        scheduleDraw();
        if (selectedId === id) renderCard(ev);
      });
      if (token !== loadToken) return;
      drawAll();
    }
  }
  setStatus("");
}
function fitToEvents() {
  const pts = [...events.values()].filter((e) => !e.cancelled && e.lat !== null).map((e) => [e.lat, e.lon]);
  if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 10 });
}

/* ---------------- wiring ---------------- */
map.on("zoomend", drawAll);
// Keyboard: Enter or Space on a focused marker opens it
document.getElementById("map").addEventListener("keydown", (e) => {
  const id = e.target && e.target.dataset ? e.target.dataset.id : null;
  if (id && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(id); }
});
map.on("click", () => { closeCard(); scheduleDraw(); });   // also folds any fanned-out group
function setRange(from, to) {
  if (to < from) { const x = from; from = to; to = x; }
  let note = "";
  if (dayDiff(from, to) > MAX_DAYS) {
    to = new Date(from); to.setDate(from.getDate() + MAX_DAYS);
    note = "Range shortened to " + MAX_DAYS + " days";
  }
  rangeFrom = from; rangeTo = to;
  $("#dFrom").value = ymd(from);
  $("#dTo").value = ymd(to);
  const set = pressedPresets();
  document.querySelectorAll("[data-preset]").forEach((b) => b.setAttribute("aria-pressed", String(set.has(b.dataset.preset))));
  $("#rangeLabel").textContent = fmt.range(from, to);
  // Presets stay relative in the URL (good for Home Screen icons); custom dates are fixed
  const url = new URL(location.href);
  ["range", "from", "to"].forEach((k) => url.searchParams.delete(k));
  if (set.size === 2) url.searchParams.set("range", "both");
  else if (set.has("next")) url.searchParams.set("range", "next");
  else if (!set.size) { url.searchParams.set("from", ymd(from)); url.searchParams.set("to", ymd(to)); }
  history.replaceState(null, "", url);
  load().then(() => { if (note) setStatus(note); });
}
document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
  const set = pressedPresets();
  if (set.has(b.dataset.preset)) set.delete(b.dataset.preset); else set.add(b.dataset.preset);
  if (!set.size) return;   // keep at least one week selected; use the dates for anything else
  const r = presetRange(set);
  setRange(r.from, r.to);
}));
$("#rangeBtn").addEventListener("click", (e) => {
  const open = e.currentTarget.getAttribute("aria-expanded") !== "true";
  e.currentTarget.setAttribute("aria-expanded", String(open));
  $("#dates").hidden = !open;
  if (open) $("#dFrom").focus();
});
["#dFrom", "#dTo"].forEach((sel) => $(sel).addEventListener("change", () => {
  const f = parseDT($("#dFrom").value, false), t = parseDT($("#dTo").value, false);
  if (f && t) setRange(f, t);
}));
$("#fOpen").addEventListener("click", (e) => { filters.open = !filters.open; e.currentTarget.setAttribute("aria-pressed", String(filters.open)); drawAll(); });
$("#fMine").addEventListener("click", (e) => { filters.mine = !filters.mine; e.currentTarget.setAttribute("aria-pressed", String(filters.mine)); drawAll(); });
$("#settingsBtn").addEventListener("click", () => {
  $("#sClub").value = settings.club; $("#sMe").value = settings.me; $("#sGroup").value = settings.group;
  $("#settings").showModal();
});
$("#settings").addEventListener("close", () => {
  if ($("#settings").returnValue !== "save") return;
  settings = { club: $("#sClub").value.trim(), me: $("#sMe").value.trim(), group: $("#sGroup").value.trim() };
  saveSettings(settings);
  load();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#card").hidden) closeCard(); });

(function init() {
  const f = parseDT(params.get("from"), false), t = parseDT(params.get("to"), false);
  if (f && t) return setRange(f, t);
  const r = params.get("range");
  const set = r === "both" ? new Set(["this", "next"]) : r === "next" ? new Set(["next"]) : new Set(["this"]);
  const pr = presetRange(set);
  setRange(pr.from, pr.to);
})();
</script>
